# Measure daily universe and sector member counts over a bounded date interval for a supplied UniverseQueryV1 screen. Retrieve sigmarail_screen_schema first. Use this for historical membership shape; it returns aggregate counts, not the full constituent list for every date.
query sigmarail_screen_sector_range($tenantId: ID!, $spec: GenericScalar!, $startDate: String!, $endDate: String!) {
  sigmarailScreenSectorRange(tenantId: $tenantId, spec: $spec, startDate: $startDate, endDate: $endDate)
}

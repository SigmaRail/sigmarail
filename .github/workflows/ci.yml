name: SigmaRail CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out SigmaRail Spec
        uses: actions/checkout@v4
        with:
          repository: SigmaRail/sigmarail-spec
          path: sigmarail-spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SigmaRail and Studio test dependencies
        run: python -m pip install -e ./sigmarail-spec -e ".[dev]" -e "./studio[dev]"
      - name: Run unified Core and Studio suite with one synthetic ClickHouse
        run: python -m pytest --sigmarail-clickhouse
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci
      - name: Run frontend tests and production build
        working-directory: studio/frontend
        run: |
          npm test
          npm run build

  lean-smoke:
    # LEAN's private image and a self-hosted Docker Desktop runner are required.
    # Do not expose this runner or its credentials to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: [self-hosted, macOS, ARM64, lean]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out SigmaRail
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out SigmaRail Spec
        uses: actions/checkout@v4
        with:
          repository: SigmaRail/sigmarail-spec
          path: sigmarail-spec
          persist-credentials: false

      - name: Check out SigmaRail Lean strategy
        uses: actions/checkout@v4
        with:
          repository: mdiggory/VeraTradingLab
          path: LeanProjects/VeraTradingLab
          # Set this repository secret when the strategy repository is private.
          token: ${{ secrets.SIGMARAIL_PLATFORM_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SigmaRail, Studio, strategy, and LEAN CLI dependencies
        run: >-
          python -m pip install
          -e ./sigmarail-spec
          -e ".[dev]"
          -e "./studio[dev]"
          -r LeanProjects/VeraTradingLab/requirements.txt
          lean==1.0.229

      - name: Check generated SigmaRail Spec runtime in the strategy tree
        run: >-
          python sigmarail-spec/tools/sync_lean_vendor.py
          --destination LeanProjects/VeraTradingLab/sigmarail_spec

      - name: Log in to private LEAN image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.SIGMARAIL_PLATFORM_READ_TOKEN && 'mdiggory' || github.actor }}
          # Grant SigmaRail repository access to the package, or set this secret
          # to a read-only token with access to the private image and strategy.
          password: ${{ secrets.SIGMARAIL_PLATFORM_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull platform LEAN image
        run: docker pull ghcr.io/mdiggory/lean-clickhouse:arm64-latest

      - name: Run full synthetic ClickHouse to SigmaRail to LEAN smoke
        env:
          SIGMARAIL_LEAN_SMOKE: "1"
          SIGMARAIL_STRATEGY_ROOT: ${{ github.workspace }}/LeanProjects/VeraTradingLab
          SIGMARAIL_SPEC_SOURCE: ${{ github.workspace }}/sigmarail-spec/src
          SIGMARAIL_STUDIO_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          SIGMARAIL_LEAN_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          SIGMARAIL_LEAN_IMAGE: ghcr.io/mdiggory/lean-clickhouse:arm64-latest
        run: python -m pytest -s -q tests/test_lean_smoke.py --sigmarail-clickhouse

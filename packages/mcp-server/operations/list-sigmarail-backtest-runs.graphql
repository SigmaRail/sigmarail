# List backtest runs visible to the selected tenant, optionally filtered to a visible strategy. Use the returned run IDs with sigmarail_backtest_report or sigmarail_backtest_compare; ownership is enforced before analytical artifacts are accessed.
query sigmarail_backtest_runs($tenantId: ID!, $irId: String, $limit: Int) {
  sigmarailBacktestRuns(tenantId: $tenantId, irId: $irId, limit: $limit)
}

- id: sigmarail.mart.weekly_metrics_derived.stage_code
  kind: concept
  title: stage code
  definition: Completed-week stage token, including the observed substage when available; NULL until the moving-average inputs are ready or a state is established.
  binds:
    column: stage_code
    table: weekly_metrics_derived
    role: canonical
  narrative: Computed from completed weekly close and the 10-, 30-, and 40-week simple averages in weekly_metrics. The ordered state transitions are a clean-room reconstruction from completed weekly bars. The transform SQL is the executable definition of the state transitions and their time boundary.
  related:
    - sigmarail.mart.weekly_metrics.close
    - sigmarail.mart.weekly_metrics.sma10w
    - sigmarail.mart.weekly_metrics.sma30w
    - sigmarail.mart.weekly_metrics.sma40w
  computability: sigmarail_native
- id: sigmarail.mart.weekly_metrics_derived.stage_duration
  kind: concept
  title: stage duration
  definition: Number of consecutive completed weekly observations with the current stage code.
  binds:
    column: stage_duration
    table: weekly_metrics_derived
    role: canonical
  narrative: Counted across completed-week observations and continued from the prior chunk checkpoint, so the value is independent of populate chunk boundaries. NULL when stage_code is NULL.
  related:
    - sigmarail.mart.weekly_metrics_derived.stage_code
  computability: sigmarail_native
- id: sigmarail.mart.weekly_metrics_derived.stage_transition_state
  kind: concept
  title: stage transition checkpoint
  definition: Internal state carried between completed-week transform chunks so the stage fold can resume without replaying earlier weekly bars.
  binds:
    column: stage_transition_state
    table: weekly_metrics_derived
  narrative: Stores the current numeric stage id, eight transition counters, the stage-4A low watermark, consecutive duration, and an initialized marker. It is an implementation checkpoint, not a separate user-facing metric. The first refresh after adding the column must rebuild stage history from the earliest available weekly bar; subsequent chunks resume from the latest initialized row before the chunk boundary.
  related:
    - sigmarail.mart.weekly_metrics_derived.stage_code
    - sigmarail.mart.weekly_metrics_derived.stage_duration
  computability: sigmarail_native

  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.relative_strength_vs_sector
  kind: concept
  title: relative strength vs sector
  definition: Percentile rank (0-100) of the tickers 3m performance within its PIT sector (ticker_classification_daily).

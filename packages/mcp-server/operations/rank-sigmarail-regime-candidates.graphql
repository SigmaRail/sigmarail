# Rank a supplied list of already-passing tickers using SigmaRail regime and alpha context.
query sigmarail_regime_rank_candidates($tenantId: ID!, $asOfDate: String!, $passingTickers: [String]!) {
  sigmarailRegimeRankCandidates(tenantId: $tenantId, asOfDate: $asOfDate, passingTickers: $passingTickers)
}

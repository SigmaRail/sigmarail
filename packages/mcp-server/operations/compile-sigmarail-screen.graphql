# Validate and compile a UniverseQueryV1 screen to parameterized SQL without executing it. Retrieve GetSigmaRailScreenSchema before authoring the AST. Use this to inspect validation errors before PreviewSigmaRailScreen; compilation does not return members or write data.
query CompileSigmaRailScreen($tenantId: ID!, $spec: GenericScalar!) {
  sigmarailScreenCompile(tenantId: $tenantId, spec: $spec)
}

# Compile a validated tenant-scoped SigmaRail PipelineDocument AST into its LEAN-compatible runtime spec. This is a pure preview: it does not save, launch, or trade.
query sigmarail_strategy_compile_pipeline(
  $tenantId: ID!
  $pipeline: GenericScalar!
) {
  sigmarailStrategyCompilePipeline(tenantId: $tenantId, pipeline: $pipeline)
}

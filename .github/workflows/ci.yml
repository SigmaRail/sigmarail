name: SigmaRail CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Use Turnip for the shared ClickHouse container and reuse its local Docker setup.
    # Do not expose the self-hosted runner to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, lean]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Turnip runtime and Docker
        run: |
          python3.11 --version
          node --version
          npm --version
          docker --version
      - name: Install SigmaRail and Studio test dependencies
        run: python3.11 -m pip install -e 'packages/sigmarail-spec[build,test]' -e ".[dev]" -e "./studio[dev]"
      - name: Build the standalone Spec distribution
        run: |
          python3.11 -m pip install build
          python3.11 -m build packages/sigmarail-spec --outdir /tmp/sigmarail-spec-dist
      - name: Run unified Core and Studio suite with one synthetic ClickHouse
        run: python3.11 -m pytest --sigmarail-clickhouse
      - name: Install AppTension workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Type-check SigmaRail in AppTension
        run: corepack pnpm --filter webapp run type-check
      - name: Build the AppTension web application
        run: corepack pnpm nx run webapp:build

  lean-smoke:
    # A self-hosted Docker Desktop runner is required for the ClickHouse integration.
    # Do not expose this runner or its credentials to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: [self-hosted, macOS, ARM64, lean]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LEAN_IMAGE: ghcr.io/sigmarail/lean/lean-clickhouse@sha256:d4f1c21a538046af806ce18dbfe8b48d94e7e84552327420b5e754203ae5a62a
    steps:
      - name: Prepare isolated Docker credentials
        run: |
          docker_config_dir="$RUNNER_TEMP/sigmarail-docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config_dir"
          # A non-empty auth map prevents Docker CLI from auto-selecting the
          # runner's Docker Desktop Keychain helper for this temporary config.
          # Preserve the installed Compose plugin, which otherwise becomes
          # undiscoverable when DOCKER_CONFIG points to this temporary directory.
          compose_plugin_path="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          if [ -z "$compose_plugin_path" ] || [ ! -x "$compose_plugin_path" ]; then
            echo "Docker Compose v2 plugin was not found in the runner's Docker CLI configuration."
            exit 1
          fi
          python3.11 - "$docker_config_dir/config.json" "$(dirname "$compose_plugin_path")" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as config:
              json.dump({"auths": {"ghcr.io": {}}, "cliPluginsExtraDirs": [sys.argv[2]]}, config)
          PY
          printf 'DOCKER_CONFIG=%s\n' "$docker_config_dir" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$docker_config_dir" docker compose version

      - name: Check out SigmaRail
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read custom LEAN revision pinned by Spec
        id: lean-revision
        run: python3.11 -c 'import json; print("revision=" + json.load(open("packages/sigmarail-spec/spec/sources.lock.json"))["sources"]["lean"]["revision"])' >> "$GITHUB_OUTPUT"

      - name: Check out the pinned custom LEAN source
        uses: actions/checkout@v4
        with:
          repository: SigmaRail/Lean
          path: custom-lean
          ref: ${{ steps.lean-revision.outputs.revision }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Locate Turnip Python 3.11
        id: local-python
        run: echo "python-path=$(command -v python3.11)" >> "$GITHUB_OUTPUT"

      - name: Install SigmaRail, Studio, and LEAN CLI dependencies
        run: >-
          python3.11 -m pip install
          -e 'packages/sigmarail-spec[build,test]'
          -e ".[dev]"
          -e "./studio[dev]"
          -r trading_lab/requirements.txt
          lean==1.0.229

      - name: Check generated SigmaRail Spec runtime in the lab template
        run: >-
          python3.11 packages/sigmarail-spec/tools/build.py --check --lean-source custom-lean
          && python3.11 packages/sigmarail-spec/tools/sync_lean_vendor.py
          --destination trading_lab/sigmarail_spec

      - name: Pull public, digest-pinned LEAN image
        run: docker pull "$LEAN_IMAGE"

      - name: Run full synthetic ClickHouse to SigmaRail to LEAN smoke
        env:
          SIGMARAIL_LEAN_SMOKE: "1"
          SIGMARAIL_TRADING_LAB_SOURCE: ${{ github.workspace }}/trading_lab
          SIGMARAIL_SPEC_SOURCE: ${{ github.workspace }}/packages/sigmarail-spec/src
          SIGMARAIL_STUDIO_PYTHON: ${{ steps.local-python.outputs.python-path }}
          SIGMARAIL_LEAN_PYTHON: ${{ steps.local-python.outputs.python-path }}
          SIGMARAIL_LEAN_IMAGE: ${{ env.LEAN_IMAGE }}
        run: python3.11 -m pytest -s -q tests/test_lean_smoke.py --sigmarail-clickhouse

  publish-spec:
    if: startsWith(github.ref, 'refs/tags/sigmarail-spec-v')
    needs: [test, lean-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches the Spec package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('packages/sigmarail-spec/pyproject.toml').read_text())['project']
          if not Path('packages/sigmarail-spec/LICENSE').is_file() or 'license' not in project:
              raise SystemExit('Add the selected open-source LICENSE and project.license metadata before publishing')
          version = project['version']
          expected = f'sigmarail-spec-v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'tag {actual!r} does not match package version {version!r}')
          PY
      - name: Build SigmaRail Spec
        run: |
          python -m pip install build
          python -m build packages/sigmarail-spec --outdir dist
      - name: Publish SigmaRail Spec with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

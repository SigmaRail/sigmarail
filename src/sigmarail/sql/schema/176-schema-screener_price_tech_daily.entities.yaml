- id: sigmarail.mart.screener_price_tech_daily.stage_code
  kind: concept
  title: daily stage code
  definition: 'Canonical detailed daily stage token projected from daily_metrics_derived.stage_code: 1A, 1B, 2A, 2B, 3A, 3B, 4A, or 4B. NULL until the required daily moving averages are available.'
  binds:
    column: stage_code
    table: screener_price_tech_daily
  related:
    - sigmarail.mart.daily_metrics_derived.stage_code
  narrative: 'One row per ticker and trading date. This L7 field is a projection; daily_metrics_derived owns the calculation and its causal session-close/as-of semantics. The calculation is owned by daily_metrics_derived; this screener field is a projection.'
  computability: sigmarail_native
- id: sigmarail.mart.screener_price_tech_daily.stage_duration
  kind: concept
  title: daily stage duration
  definition: 'Consecutive valid daily observations in the current detailed stage_code, projected from daily_metrics_derived.stage_duration. The source counts across full symbol history, so populate chunk boundaries do not reset the duration; NULL when stage_code is NULL.'
  binds:

    table: technical_ratings
  computability: sigmarail_native
- id: sigmarail.mart.technical_ratings.date
  kind: concept
  title: date
  definition: Trading session date
  binds:
    column: date
    table: technical_ratings
  computability: sigmarail_native
- id: sigmarail.mart.technical_ratings.rs_component
  kind: concept

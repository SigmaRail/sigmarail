  binds:
    column: is_sma40w_trending_up_duration
    table: market_trend_template
  computability: sigmarail_native
- id: sigmarail.mart.market_trend_template.trend_score
  kind: concept
  title: trend score
  definition: The total score (0-6) based on how many criteria are met.
  binds:
    column: trend_score
    table: market_trend_template
  computability: sigmarail_native
- id: sigmarail.mart.market_trend_template.lastupdated
  kind: concept
  title: lastupdated
  definition: Timestamp of the last update.
  binds:
    column: lastupdated
    table: market_trend_template
  computability: sigmarail_native

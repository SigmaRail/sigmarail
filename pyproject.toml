[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmarail"
version = "0.1.0"
description = "Point-in-time securities data platform that models price, fundamental, and ownership data, calculates derived metrics, and serves queryable screening and research outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "clickhouse-connect>=0.6.0",
  "numpy>=1.21.0",
  "pandas>=1.5.0",
  "pyarrow>=14.0.1",
  "platformdirs>=4.0.0",
  "pydantic>=2.0.0",
  "python-dateutil>=2.8.2",
  "pytz>=2022.1",
  "PyYAML>=6.0.1",
  "requests>=2.28.0",
  "tqdm>=4.65.0",
  "sigmarail-spec>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-django>=4.5",
  "pytest-docker>=1.0",
  "pytest-cov>=4.0",
]

[project.scripts]
sigmarail-load = "sigmarail.load:main"
sigmarail-populate = "sigmarail.populate:main"
sigmarail-schema = "sigmarail.schema:main"
sigmarail-test-data = "sigmarail.testing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigmarail = ["sql/schema/*.sql", "sql/schema/*.entities.yaml", "sql/schema-manifest.json", "spec/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", ".", "studio"]
testpaths = ["tests", "studio/tests"]
markers = [
  "integration: requires ClickHouse test database",
  "metrics: validates populated metric outputs",
]

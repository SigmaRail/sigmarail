- id: sigmarail.mart.stage_analysis.price_vs_sma30w
  kind: concept
  title: price vs sma30w
  definition: Price distance from 30-week SMA (ratio or percent, transform-defined)
  binds:
    column: price_vs_sma30w
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.price_vs_sma50w
  kind: concept
  title: price vs sma50w

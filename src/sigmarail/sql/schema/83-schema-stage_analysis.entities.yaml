version: 1
source: 83-schema-stage_analysis.sql
entities:
- id: sigmarail.mart.stage_analysis.ticker
  kind: concept
  title: ticker
  definition: Equity ticker symbol
  binds:
    column: ticker
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.date
  kind: concept
  title: date
  definition: Trading session date
  binds:
    column: date
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.lastupdated
  kind: concept
  title: lastupdated
  definition: Timestamp when this record was calculated and inserted
  binds:
    column: lastupdated
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.stage_code
  kind: concept
  title: canonical daily stage code
  definition: 'Canonical detailed daily stage token, including the observed substage (for example 2B), projected from daily_metrics_derived.stage_code. The weekly stage remains owned at weekly_metrics_derived grain.'
  binds:
    column: stage_code
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.stage_duration
  kind: concept
  title: canonical daily stage duration
  definition: Consecutive valid daily observations in the current detailed stage_code, projected from daily_metrics_derived.stage_duration.
  binds:
    column: stage_duration
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.stage_primary
  kind: concept
  title: deprecated primary-stage alias
  definition: 'Temporary broad-stage compatibility alias derived from the leading character of the canonical daily stage_code. Allocation-policy migration is separate.'
  binds:
    column: stage_primary
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.allocation_fraction
  kind: concept
  title: allocation fraction
  definition: Allocation fraction (0..1) implied by stage_primary
  binds:
    column: allocation_fraction
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.smoothed_allocation
  kind: concept
  title: smoothed allocation
  definition: Smoothed allocation fraction (0..1) for stability
  binds:
    column: smoothed_allocation
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.sma30w
  kind: concept
  title: sma30w
  definition: SPY-equivalent 30-week simple moving average (primary trend)

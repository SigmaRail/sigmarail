# Explain the regime allocation for a ticker and session date, optionally for a named policy.
query sigmarail_regime_allocation($tenantId: ID!, $asOfDate: String!, $policyName: String, $ticker: String) {
  sigmarailRegimeAllocation(tenantId: $tenantId, asOfDate: $asOfDate, policyName: $policyName, ticker: $ticker)
}

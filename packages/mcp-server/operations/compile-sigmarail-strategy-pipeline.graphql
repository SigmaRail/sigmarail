# @tool(name: "sigmarail_strategy_compile_pipeline", description: "Compile a validated tenant-scoped SigmaRail PipelineDocument AST into its LEAN-compatible runtime spec. This is a pure preview: it does not save, launch, or trade.")
query CompileSigmaRailStrategyPipeline(
  $tenantId: ID!
  $pipeline: GenericScalar!
) {
  sigmarailStrategyCompilePipeline(tenantId: $tenantId, pipeline: $pipeline)
}

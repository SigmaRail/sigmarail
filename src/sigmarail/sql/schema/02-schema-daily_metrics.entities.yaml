version: 1
source: 02-schema-daily_metrics.sql
entities:
- id: sigmarail.ema.21d.closeadj
  kind: concept
  title: 21-day EMA (closeadj)
  definition: 'Exponential moving average of split-and-dividend-adjusted close (closeadj), span 21 sessions.
    This is the house default for "21 EMA" in SigmaRail derived tables.

    '
  binds:
    column: ema21d
    role: canonical
  aliases:
  - ema21
  - 21_ema
  - ema_21d
  narrative: 'Why closeadj (not close): dividend/split continuity so backtests and moving averages do
    not jump on corporate actions. Why span 21: ~one trading month, the standard swing-trade trend reference
    used across IBD/Minervini-style screening in this stack.

    '
  related:
  - sigmarail.setup.near_21d
  falsifiers:
  - universe_v1.sma21d resolves to sma20d, NOT this 21d EMA (see that file's sidecar).
  - ema30d / ema130d are separate spans; do not conflate.

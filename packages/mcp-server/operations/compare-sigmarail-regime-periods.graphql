# Compare market breadth and regime allocation aggregates across two date windows.
query sigmarail_regime_compare_periods($tenantId: ID!, $focusStart: String!, $focusEnd: String!, $referenceStart: String!, $referenceEnd: String!) {
  sigmarailRegimeComparePeriods(tenantId: $tenantId, focusStart: $focusStart, focusEnd: $focusEnd, referenceStart: $referenceStart, referenceEnd: $referenceEnd)
}

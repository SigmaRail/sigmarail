# @tool(name: "sigmarail_regime_compare_periods", description: "Compare market breadth and regime allocation aggregates across two date windows.")
query CompareSigmaRailRegimePeriods($tenantId: ID!, $focusStart: String!, $focusEnd: String!, $referenceStart: String!, $referenceEnd: String!) {

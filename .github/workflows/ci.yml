name: SigmaRail CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SigmaRail and Studio test dependencies
        run: python -m pip install -e 'packages/sigmarail-spec[build,test]' -e ".[dev]" -e "./studio[dev]"
      - name: Build the standalone Spec distribution
        run: |
          python -m pip install build
          python -m build packages/sigmarail-spec --outdir /tmp/sigmarail-spec-dist
      - name: Run unified Core and Studio suite with one synthetic ClickHouse
        run: python -m pytest --sigmarail-clickhouse
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci
      - name: Run frontend tests and production build
        working-directory: studio/frontend
        run: |
          npm test
          npm run build

  lean-smoke:
    # LEAN's private image and a self-hosted Docker Desktop runner are required.
    # Do not expose this runner or its credentials to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: [self-hosted, macOS, ARM64, lean]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out SigmaRail
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read custom LEAN revision pinned by Spec
        id: lean-revision
        run: python3 -c 'import json; print("revision=" + json.load(open("packages/sigmarail-spec/spec/sources.lock.json"))["sources"]["lean"]["revision"])' >> "$GITHUB_OUTPUT"

      - name: Check out the pinned custom LEAN source
        uses: actions/checkout@v4
        with:
          repository: mdiggory/Lean
          path: custom-lean
          ref: ${{ steps.lean-revision.outputs.revision }}
          token: ${{ secrets.SIGMARAIL_PLATFORM_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SigmaRail, Studio, and LEAN CLI dependencies
        run: >-
          python -m pip install
          -e 'packages/sigmarail-spec[build,test]'
          -e ".[dev]"
          -e "./studio[dev]"
          -r trading_lab/requirements.txt
          lean==1.0.229

      - name: Check generated SigmaRail Spec runtime in the lab template
        run: >-
          python packages/sigmarail-spec/tools/build.py --check --lean-source custom-lean
          && python packages/sigmarail-spec/tools/sync_lean_vendor.py
          --destination trading_lab/sigmarail_spec

      - name: Log in to private LEAN image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.SIGMARAIL_PLATFORM_READ_TOKEN && 'mdiggory' || github.actor }}
          # Grant SigmaRail repository access to the package or set this secret
          # to a read-only token with access to the private image.
          password: ${{ secrets.SIGMARAIL_PLATFORM_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull platform LEAN image
        run: docker pull ghcr.io/mdiggory/lean-clickhouse:arm64-latest

      - name: Run full synthetic ClickHouse to SigmaRail to LEAN smoke
        env:
          SIGMARAIL_LEAN_SMOKE: "1"
          SIGMARAIL_TRADING_LAB_SOURCE: ${{ github.workspace }}/trading_lab
          SIGMARAIL_SPEC_SOURCE: ${{ github.workspace }}/packages/sigmarail-spec/src
          SIGMARAIL_STUDIO_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          SIGMARAIL_LEAN_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          SIGMARAIL_LEAN_IMAGE: ghcr.io/mdiggory/lean-clickhouse:arm64-latest
        run: python -m pytest -s -q tests/test_lean_smoke.py --sigmarail-clickhouse

  publish-spec:
    if: startsWith(github.ref, 'refs/tags/sigmarail-spec-v')
    needs: [test, lean-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches the Spec package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('packages/sigmarail-spec/pyproject.toml').read_text())['project']
          if not Path('packages/sigmarail-spec/LICENSE').is_file() or 'license' not in project:
              raise SystemExit('Add the selected open-source LICENSE and project.license metadata before publishing')
          version = project['version']
          expected = f'sigmarail-spec-v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'tag {actual!r} does not match package version {version!r}')
          PY
      - name: Build SigmaRail Spec
        run: |
          python -m pip install build
          python -m build packages/sigmarail-spec --outdir dist
      - name: Publish SigmaRail Spec with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

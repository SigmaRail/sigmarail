# Inspect the authenticated user's permission codes and organization role for a tenant when an operation's authorization requirements need clarification. Use GetUserTenants first to discover selectable tenants; this tool is supplementary because tenant membership is checked by the server on every call. If a required permission is absent, explain the access gap instead of retrying the protected action.
query GetUserPermissions($tenantId: ID!) {
  currentUserPermissions(tenantId: $tenantId)
  currentUserOrganizationRoles(tenantId: $tenantId) {
    id
    name
    description
    systemRoleType
    isOwnerRole
    permissions {
      code
      name
      description
      category
    }
  }
}

    column: sma30w
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.sma50w
  kind: concept
  title: sma50w
  definition: 50-week simple moving average (long-term trend filter)
  binds:
    column: sma50w
    table: stage_analysis
  computability: sigmarail_native
- id: sigmarail.mart.stage_analysis.sma50d
  kind: concept
  title: sma50d
  definition: 50-day simple moving average
